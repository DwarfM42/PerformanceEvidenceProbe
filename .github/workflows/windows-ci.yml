name: Windows CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-ci:
    name: windows-ci
    runs-on: windows-latest
    # These tests launch and observe real Windows process trees. Keep each
    # integration-test process set isolated instead of competing in parallel.
    env:
      RUST_TEST_THREADS: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Confirm repository Rust toolchain selection
        run: rustup show active-toolchain
      - name: Test Cargo wrapper portability
        run: bash tests/cargo_local_wrapper.sh
      - name: Check formatting
        run: bash scripts/cargo-local.sh fmt --check
      - name: Run canonical test suite
        run: bash scripts/cargo-local.sh test --all-targets --locked -- --nocapture
      - name: Build release binaries
        run: bash scripts/cargo-local.sh build --release --locked
