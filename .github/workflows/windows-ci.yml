name: Windows CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-ci:
    name: windows-ci
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt
      - name: Check formatting
        run: bash scripts/cargo-local.sh fmt --check
      - name: Run canonical test suite
        run: bash scripts/cargo-local.sh test --all-targets --locked -- --nocapture
      - name: Build release binaries
        run: bash scripts/cargo-local.sh build --release --locked
