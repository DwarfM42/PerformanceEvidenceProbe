name: Linux CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  linux-ci:
    name: linux-ci
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Confirm repository Rust toolchain selection
        run: rustup show active-toolchain
      - name: Test Cargo wrapper portability
        run: bash tests/cargo_local_wrapper.sh
      - name: Check formatting
        run: bash scripts/cargo-local.sh fmt --check
      - name: Run canonical test suite
        run: bash scripts/cargo-local.sh test --all-targets --locked -- --nocapture
      - name: Check all targets
        run: bash scripts/cargo-local.sh check --all-targets --locked
      - name: Run Linux runtime tests
        run: >-
          bash scripts/cargo-local.sh test
          --test linux_proc_identity
          --test linux_contract_qualification
          --test linux_attach_evidence
          --test linux_run_evidence
          --test linux_run_process_set
          --locked -- --nocapture
      - name: Build release binary
        run: bash scripts/cargo-local.sh build --release --locked --bin perf-probe
      - name: Check repository diff
        run: git diff --check
